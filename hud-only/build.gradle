plugins {
    id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "hudonly" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.register("verifyHudOnlyJar") {
    dependsOn tasks.named("remapJar")
    doLast {
        def jarFile = file("build/libs/hudonly-${project.version}.jar")
        if (!jarFile.isFile()) throw new GradleException("Missing distributable JAR: " + jarFile)
        def entries = new java.util.zip.ZipFile(jarFile)
        try {
            for (name in [
                "hudonly/client/HudOnlyClient.class",
                "hudonly/client/EditHud.class",
                "hudonly/client/FoodStack.class",
                "hudonly/client/SyringeCooldownHud.class"
            ]) {
                if (entries.getEntry(name) == null)
                    throw new GradleException("Missing HUD class in JAR: " + name)
            }
            def forbidden = ["PartyHud", "SkillHud", "TitleHud", "Glow", "Optimizer", "ItemModel"]
            if (entries.entries().any { it.name.endsWith(".class") && forbidden.any { bad -> it.name.contains(bad) } })
                throw new GradleException("JAR contains non-HUD functionality")
        } finally {
            entries.close()
        }
    }
}
tasks.named("check").configure { dependsOn "verifyHudOnlyJar" }
